name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pick-macos-runner:
    name: Pick macOS runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@v7
        with:
          script: |
            const runners = await github.paginate(
              github.rest.actions.listSelfHostedRunnersForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const online = runners.some(
              (r) =>
                r.status === "online" &&
                r.labels.some((l) => l.name === "self-hosted"),
            );
            const runner = online ? "self-hosted" : "macos-latest";
            core.info(
              `Self-hosted online: ${online} → runs-on: ${runner} (${runners.length} runner(s) listed)`,
            );
            core.setOutput("runner", runner);

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Install Linux WebKit/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-linux-x64

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Build & upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuby ${{ github.ref_name }}
          releaseBody: |
            Downloads for **${{ github.ref_name }}**:

            - **macOS**: universal `.dmg` (Apple Silicon + Intel)
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Signed build only (no Apple notarization). Completes so rust-cache is saved
  # even when the later notarization job times out waiting on Apple.
  macos-build:
    name: macOS build
    needs: pick-macos-runner
    runs-on: ${{ needs.pick-macos-runner.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-macos-${{ needs.pick-macos-runner.outputs.runner }}-universal

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Build & sign (skip notarization)
        uses: tauri-apps/tauri-action@v1
        env:
          # Signing only — omit APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID so Tauri
          # does not call notarytool here.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin

  macos-notarize:
    name: macOS notarize & upload
    needs:
      - pick-macos-runner
      - macos-build
    runs-on: ${{ needs.pick-macos-runner.outputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-macos-${{ needs.pick-macos-runner.outputs.runner }}-universal

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Notarize, staple & upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuby ${{ github.ref_name }}
          releaseBody: |
            Downloads for **${{ github.ref_name }}**:

            - **macOS**: universal `.dmg` (Apple Silicon + Intel)
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin
