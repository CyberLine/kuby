name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (manual runs upload workflow artifacts only, no GitHub Release)
        type: choice
        options:
          - windows
          - linux-and-windows
          - all
        default: windows

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# macOS: vars.MACOS_RUNNER = self-hosted | macos-latest (default: self-hosted).
# GITHUB_TOKEN cannot list runners (403) — no automatic online-detection.
#
# Self-hosted Macs: skip GitHub Actions cache (pnpm / rust-cache). Remote cache
# restore often hits "operation cannot be completed in timeout" and "pnpm cache
# is not found", while the machine already has local toolchains/stores.
#
# Tag pushes (v*): full GitHub Release (linux → windows, macOS notarize).
# workflow_dispatch: probe builds → Actions artifacts only (no release / latest.json).

jobs:
  linux:
    name: Linux x64
    if: >
      github.event_name == 'push' ||
      inputs.platforms == 'linux-and-windows' ||
      inputs.platforms == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Install Linux WebKit/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-linux-x64

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Build & upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuby ${{ github.ref_name }}
          releaseBody: |
            Downloads for **${{ github.ref_name }}**:

            - **macOS**: universal `.dmg` (Apple Silicon + Intel)
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
            - **Windows**: `.exe` (NSIS)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Build (manual probe)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        with:
          uploadUpdaterJson: false

      - name: Upload Linux workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/appimage/
            src-tauri/target/release/bundle/deb/
            src-tauri/target/release/bundle/rpm/
          if-no-files-found: error
          retention-days: 5

  windows:
    name: Windows x64
    needs: [linux]
    # Tag releases wait for Linux. Manual "windows" skips Linux (needs → skipped).
    if: >
      always() && (
        (github.event_name == 'push' && needs.linux.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.platforms == 'linux-and-windows' || inputs.platforms == 'all') &&
          needs.linux.result == 'success')
      )
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-x64

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Build & upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kuby ${{ github.ref_name }}
          releaseBody: |
            Downloads for **${{ github.ref_name }}**:

            - **macOS**: universal `.dmg` (Apple Silicon + Intel)
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
            - **Windows**: `.exe` (NSIS)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Linux already wrote latest.json; we merge windows-x86_64 below.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Merge Windows updater into latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash .github/scripts/publish-windows-release.sh \
            src-tauri/target/release/bundle

      - name: Build (manual probe)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Upload Windows workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-${{ github.run_id }}
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: error
          retention-days: 5

  # Signed build only (no Apple notarization). Upload bundles as workflow
  # artifacts so notarization can retry without a full universal rebuild.
  macos-build:
    name: macOS build
    if: github.event_name == 'push' || inputs.platforms == 'all'
    runs-on: ${{ vars.MACOS_RUNNER || 'self-hosted' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Setup Apple signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/setup-apple-signing-keychain.sh

      - name: Build & sign (skip notarization)
        uses: tauri-apps/tauri-action@v1
        env:
          # Use the keychain from the setup step. Do NOT pass APPLE_CERTIFICATE
          # here — Tauri would create another temp keychain and hit
          # errSecInternalComponent on self-hosted runners.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-action defaults this to true, which forces Finder AppleScript
          # even when CI=true. That fails on many self-hosted Macs → false so
          # the bundler passes --skip-jenkins and builds a plain DMG.
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          args: --target universal-apple-darwin

      - name: Upload signed macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 5
          # .app is a directory tree; compression keeps artifact size manageable
          compression-level: 6

      - name: Cleanup signing keychain
        if: always() && env.APPLE_KEYCHAIN_PATH != ''
        run: security delete-keychain "$APPLE_KEYCHAIN_PATH" || true

  macos-notarize:
    name: macOS notarize & upload
    # Notarize + GitHub Release only for version tags (not manual probes).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-build
    runs-on: ${{ vars.MACOS_RUNNER || 'self-hosted' }}
    # Apple upload + queue can exceed an hour on slow links; retries are in-script.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only need the CLI for `tauri signer sign` — no Rust toolchain / rebuild.
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download signed macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles-${{ github.ref_name }}
          path: src-tauri/target/universal-apple-darwin/release/bundle

      - name: Resolve bundle paths
        id: paths
        run: |
          set -euo pipefail
          root="src-tauri/target/universal-apple-darwin/release/bundle"
          app="${root}/macos/Kuby.app"
          dmg="$(find "${root}/dmg" -maxdepth 1 -name 'Kuby_*.dmg' -type f | head -1)"
          if [ ! -d "$app" ]; then
            echo "::error::Kuby.app missing after artifact download"
            find "$root" -maxdepth 4 -print || true
            exit 1
          fi
          if [ -z "$dmg" ]; then
            echo "::error::DMG missing after artifact download"
            exit 1
          fi
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          ls -lah "${root}/macos" "${root}/dmg"

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_SUBMIT_ATTEMPTS: "4"
          NOTARY_SUBMIT_TIMEOUT_SEC: "900"
          NOTARY_POLL_MAX_SEC: "3600"
        run: |
          chmod +x .github/scripts/notarize-macos.sh
          bash .github/scripts/notarize-macos.sh \
            "${{ steps.paths.outputs.app }}" \
            "${{ steps.paths.outputs.dmg }}"

      - name: Publish macOS release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/publish-macos-release.sh
          bash .github/scripts/publish-macos-release.sh "${{ steps.paths.outputs.root }}"
