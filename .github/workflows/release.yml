name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (manual runs upload workflow artifacts only, no GitHub Release)
        type: choice
        options:
          - windows
          - linux-and-windows
          - all
        default: windows

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# macOS jobs use GitHub-hosted macos-latest. Notarization preflights Apple
# (appstoreconnect.apple.com) and aborts immediately if the Notary API is down
# or unreachable from the runner.
#
# Tag pushes (v*): draft GitHub Release → linux/windows/macOS build in parallel
# → binaries land on the release (Linux/Windows via follow-up gh upload, not tauri-action)
# → publish lists assets, writes latest.json once, then undrafts.
# Platform jobs must not upload latest.json (one writer, no merge/clobber races).
# workflow_dispatch: probe builds → Actions artifacts only (no release / latest.json).

jobs:
  # Exists before the long platform builds so uploads have a release to attach to.
  create-draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.ensure.outputs.release-id }}
    steps:
      - name: Ensure draft GitHub Release
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            echo "Release ${tag} already exists (draft=${draft})"
          else
            prerelease_args=()
            if [[ "$tag" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Kuby ${tag}" \
              --notes "Downloads for **${tag}**:

          - **macOS**: universal .dmg (Apple Silicon + Intel)
          - **Linux**: .AppImage, .deb, .rpm
          - **Windows**: .exe (NSIS)" \
              "${prerelease_args[@]}"
          fi
          id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json id --jq .id)"
          echo "release-id=${id}" >> "$GITHUB_OUTPUT"
          echo "Draft release ${tag} id=${id}"

  linux:
    name: Linux x64
    needs: [create-draft]
    if: >
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'push' && needs.create-draft.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.platforms == 'linux-and-windows' || inputs.platforms == 'all'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Install Linux WebKit/GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-linux-x64

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Build Linux bundles
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        with:
          # Build only — omit releaseId/tagName so tauri-action does not touch
          # the GitHub Release. A flake on uploads.github.com must not discard the bundles.
          uploadUpdaterJson: false

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/appimage/
            src-tauri/target/release/bundle/deb/
            src-tauri/target/release/bundle/rpm/
          if-no-files-found: error
          retention-days: 5

  linux-updater:
    name: Upload Linux assets
    needs: [linux]
    if: >
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download Linux bundles
        uses: actions/download-artifact@v8
        with:
          name: linux-bundles-${{ github.ref_name }}
          path: src-tauri/target/release/bundle

      - name: Upload Linux release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/publish-linux-release.sh
          bash .github/scripts/publish-linux-release.sh src-tauri/target/release/bundle

  windows:
    name: Windows x64
    needs: [create-draft]
    if: >
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'push' && needs.create-draft.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.platforms == 'windows' ||
           inputs.platforms == 'linux-and-windows' ||
           inputs.platforms == 'all'))
      )
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-x64

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      # Build only — omit releaseId/tagName so tauri-action does not touch the
      # GitHub Release. A 422 on uploads.github.com must not discard the NSIS build.
      - name: Build Windows NSIS
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: error
          retention-days: 5

  windows-updater:
    name: Upload Windows assets
    needs: [windows]
    if: >
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download Windows NSIS bundles
        uses: actions/download-artifact@v8
        with:
          name: windows-nsis-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis

      - name: Upload Windows release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash .github/scripts/publish-windows-release.sh src-tauri/target/release/bundle

  # Signed build only (no Apple notarization). Upload bundles as workflow
  # artifacts so notarization can retry without a full universal rebuild.
  macos-build:
    name: macOS build
    needs: [create-draft]
    if: >
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'push' && needs.create-draft.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'all')
      )
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-macos-universal

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo.toml version
        run: pnpm sync-version

      - name: Setup Apple signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/setup-apple-signing-keychain.sh

      - name: Build & sign (skip notarization)
        uses: tauri-apps/tauri-action@v1
        env:
          # Use the keychain from the setup step. Do NOT pass APPLE_CERTIFICATE
          # here — Tauri would create another temp keychain and hit
          # errSecInternalComponent on headless CI runners.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-action defaults this to true, which forces Finder AppleScript
          # even when CI=true. GitHub-hosted Macs have no Finder session →
          # false so the bundler passes --skip-jenkins and builds a plain DMG.
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          args: --target universal-apple-darwin

      - name: Upload signed macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundles-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 5
          # .app is a directory tree; compression keeps artifact size manageable
          compression-level: 6

      - name: Cleanup signing keychain
        if: always() && env.APPLE_KEYCHAIN_PATH != ''
        run: security delete-keychain "$APPLE_KEYCHAIN_PATH" || true

  macos-notarize:
    name: macOS notarize & upload
    # Notarize + GitHub Release only for version tags (not manual probes).
    needs: [macos-build]
    if: >
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.macos-build.result == 'success'
    runs-on: macos-latest
    # Apple upload + queue can exceed an hour on slow links; retries are in-script.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Check Apple Notary reachability
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/notarize-macos.sh --preflight

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Only need the CLI for `tauri signer sign` — no Rust toolchain / rebuild.
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download signed macOS bundles
        uses: actions/download-artifact@v8
        with:
          name: macos-bundles-${{ github.ref_name }}
          path: src-tauri/target/universal-apple-darwin/release/bundle

      - name: Resolve bundle paths
        id: paths
        run: |
          set -euo pipefail
          root="src-tauri/target/universal-apple-darwin/release/bundle"
          app="${root}/macos/Kuby.app"
          dmg="$(find "${root}/dmg" -maxdepth 1 -name 'Kuby_*.dmg' -type f | head -1)"
          if [ ! -d "$app" ]; then
            echo "::error::Kuby.app missing after artifact download"
            find "$root" -maxdepth 4 -print || true
            exit 1
          fi
          if [ -z "$dmg" ]; then
            echo "::error::DMG missing after artifact download"
            exit 1
          fi
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          # upload-artifact/download-artifact does not reliably keep +x.
          find "${app}/Contents/MacOS" -type f -exec chmod 755 {} \;
          ls -lah "${root}/macos" "${root}/dmg" "${app}/Contents/MacOS"

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_SUBMIT_ATTEMPTS: "4"
          NOTARY_SUBMIT_TIMEOUT_SEC: "900"
          NOTARY_POLL_MAX_SEC: "3600"
        run: |
          chmod +x .github/scripts/notarize-macos.sh
          bash .github/scripts/notarize-macos.sh \
            "${{ steps.paths.outputs.app }}" \
            "${{ steps.paths.outputs.dmg }}"

      - name: Upload macOS release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/publish-macos-release.sh
          bash .github/scripts/publish-macos-release.sh "${{ steps.paths.outputs.root }}"

  # Stay draft until every platform has uploaded and latest.json is written once.
  publish:
    name: Publish GitHub Release
    needs: [linux-updater, windows-updater, macos-notarize]
    if: >
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.linux-updater.result == 'success' &&
      needs.windows-updater.result == 'success' &&
      needs.macos-notarize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/generate-latest-json.sh

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "Release assets:"
          echo "$assets"
          echo "$assets" | grep -q '\.AppImage\.tar\.gz$' || { echo "::error::missing Linux AppImage.tar.gz"; exit 1; }
          echo "$assets" | grep -q '\.deb$' || { echo "::error::missing Linux .deb"; exit 1; }
          echo "$assets" | grep -q '\.dmg$' || { echo "::error::missing macOS .dmg"; exit 1; }
          echo "$assets" | grep -qi 'setup\.exe$' || { echo "::error::missing Windows setup.exe"; exit 1; }
          echo "$assets" | grep -qx 'latest.json' || { echo "::error::missing latest.json"; exit 1; }
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published ${tag}"
