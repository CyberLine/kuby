[package]
name = "kuby"
version = "0.5.0"
description = "Native multi-cluster Kubernetes desktop client"
authors = ["Alexander Over"]
edition = "2021"
license = "MIT"

[lib]
name = "kuby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
similar = "3"
kube = { version = "4", default-features = true, features = ["runtime", "derive", "ws", "oidc", "oauth", "jsonpatch"] }
json-patch = "4"
k8s-openapi = { version = "0.28", features = ["latest"] }
# Needed to install a process-level CryptoProvider (kube=ring, sentry=aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sentry = { version = "0.49.2", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
await_holding_lock = "warn"
too_many_arguments = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
